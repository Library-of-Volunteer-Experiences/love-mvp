name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC — catches newly disclosed CVEs in unchanged code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --results=verified,unknown

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Blocking: everything that runs on the server or in the browser.
      - name: Audit web + shared packages (fail on high)
        run: >-
          npm audit --omit=dev --audit-level=high
          --workspace=@love/web --workspace=@love/backend --workspace=@love/auth
          --workspace=@love/config --workspace=@love/shared --workspace=@love/validation
          --workspace=@love/api-contracts
      # Blocking on critical. Known high advisories in Expo's build-time CLI tooling are
      # tracked in docs/security/dependency-policy.md and reported (non-blocking) below.
      - name: Audit mobile (fail on critical)
        run: npm audit --omit=dev --audit-level=critical --workspace=@love/mobile
      - name: Report all advisories (non-blocking)
        if: always()
        continue-on-error: true
        run: npm audit
